<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Magical Invitation 🐍</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 0;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(
                    circle at top,
                    #24543b 0%,
                    #102e20 45%,
                    #06150e 100%
                );
            overflow-x: hidden;
            color: #e0e7df;
        }

        /* Floating magical particles */

        .particle {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            color: #c7d9c7;
            opacity: 0;
            animation: floatUp linear forwards;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main invitation card */

        .card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 440px;
            padding: 35px 25px;
            text-align: center;

            background: linear-gradient(
                145deg,
                rgba(20, 48, 33, 0.97),
                rgba(8, 25, 16, 0.98)
            );

            border: 2px solid #a7b7a8;
            border-radius: 12px;

            box-shadow:
                0 0 15px rgba(150, 190, 155, 0.12),
                0 0 40px rgba(0, 0, 0, 0.5);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative border */

        .inner-border {
            border: 1px solid rgba(192, 205, 192, 0.35);
            padding: 25px 15px;
            border-radius: 6px;
        }

        .snake {
            font-size: 55px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(126, 200, 145, 0.3));
        }

        .house {
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 5px;
            color: #b6c5b6;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .divider {
            color: #a7b7a8;
            letter-spacing: 8px;
            margin: 18px 0;
        }

        h1 {
            font-size: 29px;
            line-height: 1.4;
            color: #d8e5d5;
            font-weight: normal;
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(157, 207, 164, 0.15);
        }

        .subtitle {
            font-size: 15px;
            line-height: 1.8;
            color: #bac9bb;
            margin: 15px 0;
        }

        .letter {
            font-size: 14px;
            line-height: 1.9;
            color: #d2ddd1;
            margin: 20px 0;
