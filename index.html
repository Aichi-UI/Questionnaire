<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Question for You 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Trebuchet MS", sans-serif;
            background: linear-gradient(135deg, #0a2e1b, #1b4332, #081c15);
            overflow: hidden;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(255, 105, 150, 0.2);
            text-align: center;
        }

        .heart {
            font-size: 65px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            color: #ff4f87;
            font-size: 28px;
            line-height: 1.4;
        }

        p {
            color: #86616f;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            min-height: 55px;
        }

        button {
            border: none;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #yesBtn {
            background: #ff5c93;
            color: white;
            box-shadow: 0 4px 12px #ffb2ca;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background: #eee;
            color: #777;
        }

        #noBtn.running {
            position: fixed;
            z-index: 10;
            transition: left 0.15s ease, top 0.15s ease;
        }

        #message {
            display: none;
            margin-top: 25px;
            color: #ff4f87;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
        }

        .floating-heart {
            position: fixed;
            bottom: -40px;
            font-size: 25px;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes floatUp {
            to {
                transform: translateY(-110vh) rotate(25deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">💗</div>

        <h1 id="question">
            Will you go on a date with me? 🥹
        </h1>

        <div class="buttons" id="buttons">
            <button id="yesBtn">YES 💖</button>
            <button id="noBtn">NO 🙈</button>
        </div>

        <div id="message">
            YAYYYYY!! 🥹💗<br>
            IT'S A DATE THEN! 💐<br>
            Can't wait to see you! ❤️
        </div>

    </div>

    <script>
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const question = document.getElementById("question");
        const subtitle = document.getElementById("subtitle");
        const buttons = document.getElementById("buttons");
        const message = document.getElementById("message");

        function moveNoButton() {
            const padding = 15;

            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const x = padding + Math.random() * Math.max(0, maxX - padding);
            const y = padding + Math.random() * Math.max(0, maxY - padding);

            noBtn.classList.add("running");

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        // Make the NO button run away from the mouse.
        noBtn.addEventListener("pointerenter", moveNoButton);

        // Make it run away when clicked or touched.
        noBtn.addEventListener("pointerdown", function(event) {
            event.preventDefault();
            moveNoButton();
        });

        noBtn.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveNoButton();
        }, { passive: false });

        // Celebrate when YES is clicked!
        yesBtn.addEventListener("click", function() {
            question.textContent = "YOU SAID YES!! 🥹💖";
            subtitle.textContent = "You just made me the happiest person!";
            buttons.style.display = "none";
            message.style.display = "block";

            for (let i = 0; i < 35; i++) {
                setTimeout(createHeart, i * 100);
            }
        });

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";

            const emojis = ["💗", "💖", "💕", "❤️", "🌷"];

            heart.textContent = emojis[
                Math.floor(Math.random() * emojis.length)
            ];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 6000);
        }
    </script>

</body>
</html>
